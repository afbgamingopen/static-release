  <meta property="og:description" content="كمّل المهام واحصل على فرص إضافية للسحب! 🎡
واربح حتى 10,000 جنيه مصري! 🔥" />
  <meta property="og:image" content="https://www.pharaohquest.com/ogimage.jpg" />
  <meta property="og:image:secure_url" content="https://www.pharaohquest.com/ogimage.jpg" />

  <title>Pharaoh Quest</title>
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      font-family: "Arial", sans-serif;
    }

    body {
      -webkit-font-smoothing: antialiased;
      background-color: black;
      display: flex;
      justify-content: center;
    }

    img {
      margin: 0;
      padding: 0;
    }

    .container {
      width: 100%;
      height: 100vh;
      position: relative;
      max-width: 550px;
    }

    .container .BG {
      width: 100%;
      object-fit: cover;
    }

    .container .btn-container {
      position: absolute;
      left: 0%;
      top: 45.5%;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      gap: 20px;
    }

    .container .btn {
      width: 40%;
    }
  </style>
</head>

<body>
  <div class="container" onclick="onClickBtn()">
    <img class="BG" src="files/background.jpg" alt="background" />
    <div class="btn-container">
      <img class="btn" onclick="goToTelegram(event)" src="files/TG.png" alt="Telegram" />
      <img class="btn" src="files/GP.png" alt="Google Play" />
    </div>
  </div>
  <script src="files/common.js"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const APK_NAME = "pharaohquest.prod.3.2.apk";
    const APK_BASE = "https://downloads.afbgaming.app/";
    const API_BASE = "https://api.anubisriches.com/api/advertising";

    function sendTrack(endpoint) {
      fetch(getUrl(API_BASE + endpoint)).catch(() => { });
    }

    window.onload = function () {
      sendTrack("/onshow");
    };

    function downloadApk() {
      const a = document.createElement("a");
      a.href = APK_BASE + APK_NAME;
      a.download = "";
      a.addEventListener("click", (e) => e.stopPropagation());
      document.body.appendChild(a);
      a.click();
      setTimeout(() => a.remove(), 5000);
    }

    function onClickBtn() {
      const leadId = urlParams.get("leadId") || "";
      const fbc = urlParams.get("fbclid") || "";
      const fbp = getCookie("_fbp") || "";
      const { origin, pathname } = window.location;

      const copyParam = {
        fbc,
        fbp,
        leadId,
        link: getUrl(origin + pathname),
      };
      copyText(JSON.stringify(copyParam));
      downloadApk();
      sendTrack("/ondownload");
    }

    function goToTelegram(e) {
      e.stopPropagation();
      window.open("https://t.me/pharaohquest_game");
    }
  </script>
</body>

</html>
