  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const API_BASE = "https://api.anubisriches.com/api/advertising";
    // const IOS_URL = "https://ios.goldniles.com/index.html?channel=190561";
    const ANDROID_URL = "https://h5.goldniles.com/index.html?channel=190561";

    function isIOS() {
      const ua = navigator.userAgent || navigator.vendor || "";
      return (
        /iPad|iPhone|iPod/.test(ua) ||
        (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1)
      );
    }

    function sendTrack(endpoint) {
      fetch(getUrl(API_BASE + endpoint)).catch(() => { });
    }

    function gameUrl(params) {
      // const base = isIOS() ? IOS_URL : ANDROID_URL;
      const base = ANDROID_URL;
      const qs = new URLSearchParams();
      for (const key in params) {
        if (params[key]) qs.append(key, params[key]);
      }
      const s = qs.toString();
      if (!s) return base;
      return base + (base.includes("?") ? "&" : "?") + s;
    }

    function buildCopyParam() {
      const { origin, pathname } = window.location;
      return {
        fbc: urlParams.get("fbclid") || "",
        fbp: getCookie("_fbp") || "",
        leadId: urlParams.get("leadId") || "",
        link: getUrl(origin + pathname),
      };
    }
