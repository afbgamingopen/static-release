<body>
  <div class="container">
    <img class="BG" src="files/background.jpg" alt="background" />
    <div class="btn-container">
      <img class="btn" onclick="onClickBtn()" src="files/download.png" alt="Telegram" />
      <img class="btn2" onclick="goToTelegram(event)" src="files/tg.png" alt="Google Play" />
    </div>
  </div>
  <script src="files/common.js"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    // const APK_NAME = "pyramidfun.prod.3.14.125635.apk";
    // const APK_BASE = "https://downloads.afbgaming.app/";
    const API_BASE = "https://api.anubisriches.com/api/advertising";
    const IOS_URL = "https://ios.goldniles.com";
    const ANDROID_URL = "https://h5.goldniles.com";

    function isIOS() {
      const ua = navigator.userAgent || navigator.vendor || "";
      return (
        /iPad|iPhone|iPod/.test(ua) ||
        (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1)
      );
    }

    function sendTrack(endpoint) {
      fetch(getUrl(API_BASE + endpoint)).catch(() => { });
    }

    window.onload = function () {
      sendTrack("/onshow");
    };

    // function downloadApk() {
    //   const a = document.createElement("a");
    //   a.href = APK_BASE + APK_NAME;
    //   a.download = "";
    //   a.addEventListener("click", (e) => e.stopPropagation());
    //   document.body.appendChild(a);
    //   a.click();
    //   setTimeout(() => a.remove(), 5000);
    // }

    function onClickBtn() {
      const leadId = urlParams.get("leadId") || "";
      const fbc = urlParams.get("fbclid") || "";
      const fbp = getCookie("_fbp") || "";
      const { origin, pathname } = window.location;

      const copyParam = {
        fbc,
        fbp,
        leadId,
        link: getUrl(origin + pathname),
      };
      copyText(JSON.stringify(copyParam));
      // downloadApk();
      sendTrack("/ondownload");

      const target = isIOS() ? IOS_URL : ANDROID_URL;
      window.location.href = getUrl(target);
    }

    function goToTelegram(e) {
      e.stopPropagation();
      window.open("https://t.me/goldnile_channel");
    }
  </script>
</body>
