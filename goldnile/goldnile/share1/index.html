  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      font-family: "Arial", sans-serif;
    }

    body {
      -webkit-font-smoothing: antialiased;
      background-color: black;
      display: flex;
      justify-content: center;
      /* font-family: Roboto, RobotoDraft, Helvetica, Arial, sans-serif; */
    }

    h3 {
      height: 28px;
      size: 28px;
      text-align: left;
    }

    img {
      margin: 0;
      padding: 0;
    }

    span {
      display: inline-block;
      height: 100%;
    }

    .container {
      width: 100%;
      height: 100vh;
      position: relative;
      max-width: 550px;
    }

    .container .BG {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .container .btn-container {
      position: absolute;
      left: 0%;
      top: 29.5%;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      gap: 20px;
    }

    .container .btn {
      width: 40%;
    }

    .footer {
      color: transparent;
      position: absolute;
      left: 0%;
      bottom: 0%;
      width: 100%;
    }

    .footer img {
      width: 100%;
      height: auto;
    }

    .footer .download {
      width: 32%;
      position: absolute;
      right: 2%;
      top: 50%;
      transform: translateY(-50%);
      z-index: 1;
    }

<body>
  <div class="container" onclick="onClickBtn()">
    <img class="BG" src="/files/background.jpg" />
    <div class="btn-container">
      <img class="btn" onclick="goToTelegram(event)" src="/files/TG.png" />
      <img class="btn" src="/files/GP.png" />
    </div>
    <div class="footer" onclick="onClickBtn()">
      <img src="/files/footer.png" />
      <img class="download" src="/files/download.png" />
    </div>
  </div>
  <script src="/files/common.js"></script>
  <script>
    const TG_URL = "https://t.me/GoldNile_game";
    const urlParams = new URLSearchParams(window.location.search);
    const APK_NAME = "goldnile.prod.3.2.apk";
    const APK_BASE = "https://downloads.afbgaming.app/";
    const API_BASE = "https://api.anubisriches.com/api/advertising";

    function sendTrack(endpoint) {
      fetch(getUrl(API_BASE + endpoint)).catch(() => { });
    }

    window.onload = function () {
      sendTrack("/onshow");
    };

    function downloadApk() {
      const a = document.createElement("a");
      a.href = APK_BASE + APK_NAME;
      a.download = "";
      document.body.appendChild(a);
      a.click();
      setTimeout(() => a.remove(), 5000);
    }

    function onClickBtn() {
      const leadId = urlParams.get("leadId") || "";
      const fbc = urlParams.get("fbclid") || "";
      const fbp = getCookie("_fbp") || "";
      const { origin, pathname } = window.location;

      const copyParam = {
        fbc,
        fbp,
        leadId,
        link: getUrl(origin + pathname),
      };
      copyText(JSON.stringify(copyParam));
      downloadApk();
      sendTrack("/ondownload");
    }

    function goToTelegram(e) {
      e.stopPropagation();
      window.open(TG_URL);
    }
  </script>
</body>
