  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      font-family: "Arial", sans-serif;
    }

    body {
      -webkit-font-smoothing: antialiased;
      background-color: black;
      display: flex;
      justify-content: center;
      /* font-family: Roboto, RobotoDraft, Helvetica, Arial, sans-serif; */
    }

    h3 {
      height: 28px;
      size: 28px;
      text-align: left;
    }

    img {
      margin: 0;
      padding: 0;
    }

    span {
      display: inline-block;
      height: 100%;
    }

    .container {
      width: 100%;
      aspect-ratio: 2880 / 6240;
      /* mobile 默认 */
      background: url("files/background.jpg") center / cover no-repeat;
      position: relative;
    }

    .container .btn-container {
      position: absolute;
      left: 0%;
      bottom: 5%;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      gap: 20px;
    }

    .container .btn {
      width: 40%;
    }

    /* pc */
    @media (min-width: 1024px) {
      .container {
        aspect-ratio: 5700 / 3300;
        /* pc */
        background-image: url("files/background-pc.jpg");
      }

      .container .btn-container {
        left: 50%;
        transform: translateX(-50%);
        bottom: 2%;
        width: 45%;
        gap: 30px;
      }
    }
  </style>

<body>
  <div class="container">
    <div class="btn-container">
      <img class="btn" onclick="goToTelegram(event)" src="files/TG.png" />
      <img class="btn" onclick="onClickBtn()" src="files/GP.png" />
    </div>
  </div>
  <script src="files/common.js"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const APK_NAME = "enjoyplusplus.prod.3.14.apk";
    const APK_BASE = "https://downloads.afbgaming.app/";
    const API_BASE = "https://api.anubisriches.com/api/advertising";

    function sendTrack(endpoint) {
      fetch(getUrl(API_BASE + endpoint)).catch(() => { });
    }

    window.onload = function () {
      sendTrack("/onshow");
    };

    function downloadApk() {
      const a = document.createElement("a");
      a.href = APK_BASE + APK_NAME;
      a.download = "";
      a.addEventListener("click", (e) => e.stopPropagation());
      document.body.appendChild(a);
      a.click();
      setTimeout(() => a.remove(), 5000);
    }

    function onClickBtn() {
      const leadId = urlParams.get("leadId") || "";
      const fbc = urlParams.get("fbclid") || "";
      const fbp = getCookie("_fbp") || "";
      const { origin, pathname } = window.location;

      const copyParam = {
        fbc,
        fbp,
        leadId,
        link: getUrl(origin + pathname),
      };
      copyText(JSON.stringify(copyParam));
      downloadApk();
      sendTrack("/ondownload");
    }

    function goToTelegram(e) {
      e.stopPropagation(); // 阻止冒泡
      const tgLink = "https://t.me/enjoyplusplus_bot";
      window.open(tgLink);
    }
  </script>
