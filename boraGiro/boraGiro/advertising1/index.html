  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      font-family: "Roboto", "Arial", sans-serif;
    }

    body {
      -webkit-font-smoothing: antialiased;
      background-color: #000;
      display: flex;
      justify-content: center;
    }

    img {
      margin: 0;
      padding: 0;
      display: block;
    }

    .container {
      width: 100%;
      min-height: 100vh;
      max-width: 550px;
      background: #fdf8e8;
      overflow-x: hidden;
    }

    /* ===== 整页设计图 + 叠加按钮 ===== */
    /* .page 高度 = 背景图高度，按钮用百分比定位，任何屏宽都与设计稿对齐 */
    .page {
      position: relative;
      width: 100%;
    }

    .page .bg {
      width: 100%;
      height: auto;
      -webkit-user-drag: none;
      user-select: none;
    }

    .btn {
      position: absolute;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-drag: none;
      user-select: none;
      animation: pulse 1.8s ease-in-out infinite;
      will-change: transform;
    }

    .btn:active {
      animation: none;
      transform: scale(.97);
    }

    /* 顶部按钮：hero 下方 */
    .btn-top {
      top: 24.45%;
      left: 2.75%;
      width: 94.5%;
    }

    /* 底部按钮：通栏，带棕榈叶 */
    .btn-bottom {
      top: 91.25%;
      left: 0;
      width: 100%;
      animation: none;
    }

    /* 三张游戏卡片的点击热区 */
    .hot {
      position: absolute;
      left: 0;
      width: 100%;
      top: 51.6%;
      height: 28.4%;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    @keyframes pulse {

      0%,
      100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.025);
      }
    }

    /* ===== 等待安装提示的加载层 ===== */
    .loading-mask {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      left: 0;
      z-index: 99;
      background: rgba(0, 0, 0, .6);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      color: #fff;
      font-size: 17px;
      font-weight: 500;
    }

    .loading-mask.show {
      display: flex;
    }

    .loading-mask .spinner {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      border: 4px solid rgba(255, 255, 255, .3);
      border-top-color: #fff;
      animation: spin .8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

<body>
  <div class="container">
    <div class="page">
      <img class="bg" src="files/background.jpg" alt="BoraGiro - Instale e comece a jogar" />

      <!-- 顶部安装按钮 -->
      <img class="btn btn-top" src="files/btn1.png" alt="Instalar aplicativo" onclick="onClickBtn()" />

      <!-- 游戏卡片热区 -->
      <div class="hot" onclick="onClickBtn()"></div>

      <!-- 底部安装按钮 -->
      <img class="btn btn-bottom" src="files/btn2.png" alt="Instalar aplicativo" onclick="onClickBtn()" />
    </div>
  </div>

  <!-- 等待安装提示的加载层 -->
  <div class="loading-mask" id="loadingMask">
    <div class="spinner"></div>
    <div>Preparando instalação...</div>
  </div>

  <script src="files/common.js?v=2"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const API_BASE = "https://api.anubisriches.com/api/advertising";
    // const H5_URL = "https://h5.boragiro.net/index.html?channel=101217";
    const H5_URL = "https://https://testbora.momospin.com";

    function sendTrack(endpoint) {
      fetch(getUrl(API_BASE + endpoint)).catch(() => { });
    }

    function gameUrl(params) {
      const base = H5_URL;
      const qs = new URLSearchParams();
      for (const key in params) {
        if (params[key]) qs.append(key, params[key]);
      }
      const s = qs.toString();
      if (!s) return base;
      return base + (base.includes("?") ? "&" : "?") + s;
    }

    let deferredPrompt = null;
    const isStandalone =
      window.matchMedia("(display-mode: standalone)").matches ||
      window.navigator.standalone === true;

    function buildCopyParam() {
      const { origin, pathname } = window.location;
      return {
        fbc: urlParams.get("fbclid") || "",
        fbp: getCookie("_fbp") || "",
        leadId: urlParams.get("leadId") || "",
        link: getUrl(origin + pathname),
      };
    }

    // 保存落地页的追踪参数，安装后从桌面启动时 start_url 上没有这些参数
    if (!isStandalone && window.location.search.length > 1) {
      localStorage.setItem("copyParam", JSON.stringify(buildCopyParam()));
    }

    if (isStandalone) {
      let saved = null;
      try {
        saved = JSON.parse(localStorage.getItem("copyParam"));
      } catch (e) { }
      window.location.replace(gameUrl(saved));
    }

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js").catch(() => { });
    }

    window.addEventListener("beforeinstallprompt", (e) => {
      e.preventDefault();
      deferredPrompt = e;
    });

    window.addEventListener("appinstalled", () => {
      deferredPrompt = null;
      window.location.replace(gameUrl(buildCopyParam()));
    });

    window.onload = function () {
      if (!isStandalone) sendTrack("/onshow");
    };

    // 浏览器支持 PWA 安装提示：Chrome / Edge / Samsung 等 Chromium 内核，iOS 不支持
    const canPrompt = !isIOS() && "onbeforeinstallprompt" in window;
    let busy = false;

    function showLoading(show) {
      document.getElementById("loadingMask").classList.toggle("show", show);
    }

    // 等待 beforeinstallprompt，最多 ms 毫秒；超时返回 null
    function waitForPrompt(ms) {
      return new Promise((resolve) => {
        if (deferredPrompt) return resolve(deferredPrompt);
        const timer = setTimeout(() => resolve(deferredPrompt), ms);
        window.addEventListener(
          "beforeinstallprompt",
          (e) => {
            clearTimeout(timer);
            resolve(e);
          },
          { once: true }
        );
      });
    }

    async function onClickBtn() {
      if (busy) return;
      busy = true;

      const copyParam = buildCopyParam();
      copyText(JSON.stringify(copyParam));
      sendTrack("/ondownload");

      let promptEvent = deferredPrompt;
      // 符合安装条件但 Chrome 还没派发安装事件：显示加载层，最多等 3 秒
      if (!promptEvent && canPrompt) {
        showLoading(true);
        promptEvent = await waitForPrompt(3000);
        showLoading(false);
      }

      if (promptEvent) {
        deferredPrompt = null;
        promptEvent.prompt();
        try {
          const choice = await promptEvent.userChoice;
          busy = false;
          // 安装成功后由 appinstalled 事件统一跳转
          if (choice.outcome === "accepted") return;
          if (choice.outcome === "dismissed") return;
        } catch (e) { }
      }

      busy = false;
      window.location.href = gameUrl(copyParam);
    }
  </script>
