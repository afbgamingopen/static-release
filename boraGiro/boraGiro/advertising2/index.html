  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      font-family: "Roboto", "Arial", sans-serif;
    }

    body {
      -webkit-font-smoothing: antialiased;
      background-color: #000;
      display: flex;
      justify-content: center;
    }

    img {
      margin: 0;
      padding: 0;
      display: block;
    }

    .container {
      width: 100%;
      min-height: 100vh;
      max-width: 550px;
      background: #fdf8e8;
      overflow-x: hidden;
    }

    /* ===== 整页设计图 + 叠加按钮 ===== */
    /* .page 高度 = 背景图高度，按钮用百分比定位，任何屏宽都与设计稿对齐 */
    .page {
      position: relative;
      width: 100%;
    }

    .page .bg {
      width: 100%;
      height: auto;
      -webkit-user-drag: none;
      user-select: none;
    }

    .btn {
      position: absolute;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-drag: none;
      user-select: none;
      animation: pulse 1.8s ease-in-out infinite;
      will-change: transform;
    }

    .btn:active {
      animation: none;
      transform: scale(.97);
    }

    /* 顶部按钮：hero 下方 */
    .btn-top {
      top: 24.45%;
      left: 2.75%;
      width: 94.5%;
    }

    /* 底部按钮：通栏，带棕榈叶 */
    .btn-bottom {
      top: 91.25%;
      left: 0;
      width: 100%;
      animation: none;
    }

    /* 三张游戏卡片的点击热区 */
    .hot {
      position: absolute;
      left: 0;
      width: 100%;
      top: 51.6%;
      height: 28.4%;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    @keyframes pulse {

      0%,
      100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.025);
      }
    }
  </style>

<body>
  <div class="container">
    <div class="page">
      <img class="bg" src="files/background.jpg" alt="BoraGiro - Instale e comece a jogar" />

      <!-- 顶部安装按钮 -->
      <img class="btn btn-top" src="files/btn1.png" alt="Instalar aplicativo" onclick="onClickBtn()" />

      <!-- 游戏卡片热区 -->
      <div class="hot" onclick="onClickBtn()"></div>

      <!-- 底部安装按钮 -->
      <img class="btn btn-bottom" src="files/btn2.png" alt="Instalar aplicativo" onclick="onClickBtn()" />
    </div>
  </div>

  <script src="files/common.js?v=2"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const APK_NAME = "boragiro.prod.3.2.522879.apk";
    const APK_BASE = "https://downloads.afbgaming.app/";
    const API_BASE = "https://api.anubisriches.com/api/advertising";

    function sendTrack(endpoint) {
      fetch(getUrl(API_BASE + endpoint)).catch(() => { });
    }

    window.onload = function () {
      sendTrack("/onshow");
    };

    function downloadApk() {
      const a = document.createElement("a");
      a.href = APK_BASE + APK_NAME;
      a.download = "";
      a.addEventListener("click", (e) => e.stopPropagation());
      document.body.appendChild(a);
      a.click();
      setTimeout(() => a.remove(), 5000);
    }

    function onClickBtn() {
      const leadId = urlParams.get("leadId") || "";
      const fbc = urlParams.get("fbclid") || "";
      const fbp = getCookie("_fbp") || "";
      const { origin, pathname } = window.location;

      const copyParam = {
        fbc,
        fbp,
        leadId,
        link: getUrl(origin + pathname),
      };
      copyText(JSON.stringify(copyParam));
      downloadApk();
      sendTrack("/ondownload");
    }
  </script>
</body>
